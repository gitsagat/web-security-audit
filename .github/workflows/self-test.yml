name: self-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Sintaxe dos scripts
        run: |
          for f in skills/audit/scripts/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck -S warning skills/audit/scripts/*.sh
      - name: Scanner roda sobre o próprio repositório
        run: bash skills/audit/scripts/scan_code.sh . > /dev/null
      - name: JSON do plugin e do marketplace
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
